name: Crecimiento diario con Codex local
on:
  workflow_dispatch:
    inputs:
      result_branch:
        description: Rama temporal que genero el trabajador local
        type: string
        required: true
      base_sha:
        description: Commit exacto de main sobre el que se genero la rama
        type: string
        required: true
      dry_run:
        description: Probar coordinacion y cuota sin consumir tokens
        type: boolean
        default: false
concurrency:
  group: sync-ofertas
  cancel-in-progress: false
  queue: max
permissions:
  contents: write
jobs:
  growth:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.155.2'
          extended: true
      - name: Preparar controles de publicacion
        run: |
          mkdir -p "$RUNNER_TEMP/growth-controls"
          cp tools/publish_growth.py tools/check_growth_build.py tools/growth_audit.py tools/growth_bridge.py tools/growth_hold.py tools/notify_growth.py "$RUNNER_TEMP/growth-controls/"
      - name: Validar y publicar el resultado local
        id: publish
        env:
          GROWTH_PUBLISHER: ${{ runner.temp }}/growth-controls/publish_growth.py
          GROWTH_NOTIFICATION_FILE: ${{ runner.temp }}/growth-notification.txt
          GROWTH_DRY_RUN: ${{ inputs.dry_run || false }}
          GROWTH_RESULT_BRANCH: ${{ inputs.result_branch }}
          GROWTH_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          python "$RUNNER_TEMP/growth-controls/growth_bridge.py"
      - name: Resumir mejora publicada en Telegram
        if: success() && steps.publish.outputs.published == 'true' && inputs.dry_run != true
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROWTH_NOTIFICATION_FILE: ${{ runner.temp }}/growth-notification.txt
        run: python "$RUNNER_TEMP/growth-controls/notify_growth.py"
      - name: Limpiar rama temporal tras exito
        if: success()
        env:
          RESULT_BRANCH: ${{ inputs.result_branch }}
        run: |
          if [ -n "$(git ls-remote --heads origin "$RESULT_BRANCH")" ]; then
            git push origin --delete "$RESULT_BRANCH"
          fi
      - name: Avisar solo si falla
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
            --data-urlencode "text=Fallo en crecimiento Codex. Comprueba que el PC este encendido y con sesion Codex. $RUN_URL" \
            | python -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("ok") else 1)'
