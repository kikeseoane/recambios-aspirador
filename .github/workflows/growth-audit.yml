name: Auditoria diaria de cobertura
on:
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python tools/growth_audit.py --output reports/growth-audit.md
      - uses: actions/upload-artifact@v4
        with:
          name: growth-audit
          path: reports/growth-audit.md
          retention-days: 30
